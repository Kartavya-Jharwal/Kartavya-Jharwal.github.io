<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Polymath Resume Dossier — a recruiter-facing adaptive resume engine for Kartavya Jharwal, tuned to role and industry context.">
<title>Polymath Resume Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- APP -->
<div class="app">

  <!-- LEFT: Configuration -->
  <aside class="aside l">
    <div>
      <a class="brand-lockup" href="./" aria-label="Kartavya Jharwal home">
        <picture class="brand-mark">
          <source
            media="(prefers-color-scheme: light)"
            srcset="./assets/img/logos/logo_kj_dark.png 1x, ./assets/img/logos/logo_kj_dark_256.png 2x">
          <source
            media="(prefers-color-scheme: dark)"
            srcset="./assets/img/logos/logo_kj_light.png 1x, ./assets/img/logos/logo_kj_light_256.png 2x">
          <img src="./assets/img/logos/logo_kj_light.png" alt="Kartavya Jharwal monogram logo">
        </picture>
        <div class="brand-copy">
          <div class="brand-title">Kartavya Jharwal</div>
          <div class="brand-lbl">Polymath Resume Dossier</div>
        </div>
      </a>

      <div class="sec-title">
        <div class="sec-dot"></div>
        Configuration
      </div>

      <div class="card" id="mxD"></div>

      <p class="microcopy">Dynamically generate a targeted resume by selecting a role and industry context above.</p>

      <div class="action-stack">
        <button class="btn-secondary" id="btnSurprise" type="button">Surprise me with a random pair</button>
      </div>
    </div>

    <div class="mt-auto pt-8 border-t border-[var(--border-obsidian)]">
      <div class="status-txt" style="color: var(--muted-dark); margin-bottom: 8px;">Ref: POLYMATH_DOSSIER</div>
      <div class="status-txt" style="color: var(--muted-dark);">&copy; 2026 Kartavya Jharwal</div>
    </div>
  </aside>

  <!-- CENTER: Stage -->
  <main class="stage">
    <div class="mobile-brand">
      <a class="brand-lockup" href="./" aria-label="Kartavya Jharwal home">
        <picture class="brand-mark">
          <source
            media="(prefers-color-scheme: light)"
            srcset="./assets/img/logos/logo_kj_dark.png 1x, ./assets/img/logos/logo_kj_dark_256.png 2x">
          <source
            media="(prefers-color-scheme: dark)"
            srcset="./assets/img/logos/logo_kj_light.png 1x, ./assets/img/logos/logo_kj_light_256.png 2x">
          <img src="./assets/img/logos/logo_kj_light.png" alt="Kartavya Jharwal monogram logo">
        </picture>
        <div class="brand-copy">
          <div class="brand-title">Kartavya Jharwal</div>
          <div class="brand-lbl">Polymath Resume Dossier</div>
        </div>
      </a>
    </div>


    <div class="wrap" id="wrap" data-sheet-shell="a4">
      <div class="sheet" id="sheet" data-sheet-format="a4" data-a4-mode="desktop" data-a4-truncated="false">
        <div id="r-name" class="r-name"></div>
        <div id="r-ctc" class="r-ctc"></div>
        <section id="r-summary" class="r-sec"></section>
        <section id="r-experience" class="r-sec"></section>
        <section id="r-projects" class="r-sec"></section>
        <section id="r-education" class="r-sec"></section>
        <section id="r-additional" class="r-sec"></section>
      </div>
    </div>
  </main>

  <!-- RIGHT: Telemetry -->
  <aside class="aside r">
    <div class="sec-title">
      <div class="sec-dot"></div>
      View Controls
    </div>

    <div class="zoom-ctrl">
      <button class="zoom-btn" id="btnZoomIn" type="button" aria-label="Zoom in"><i class="ti ti-zoom-in" aria-hidden="true"></i></button>
      <div class="zoom-sep"></div>
      <button class="zoom-btn" id="btnZoomOut" type="button" aria-label="Zoom out"><i class="ti ti-zoom-out" aria-hidden="true"></i></button>
      <div class="zoom-sep"></div>
      <button class="zoom-btn" id="btnZoomReset" type="button" aria-label="Reset zoom"><i class="ti ti-maximize" aria-hidden="true"></i></button>
      <div class="zoom-sep"></div>
      <button class="zoom-btn" id="btnRedact" type="button" aria-label="Hide contact details" aria-pressed="false"><i class="ti ti-eye-off" aria-hidden="true"></i></button>
    </div>

    <div class="sec-title" style="margin-top: 24px;">
      <div class="sec-dot"></div>
      Actions
    </div>

    <a class="dl-btn" id="dlBtn" download hidden>
      Download PDF
      <i class="ti ti-download text-lg" aria-hidden="true"></i>
    </a>
  </aside>

</div>

<!-- Dropdown Popover -->
<div class="mtx-pop" id="popover" role="listbox" aria-label="Resume configuration options"></div>

<script src="public/data.js"></script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
